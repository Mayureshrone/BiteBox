<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BiteBox Signup</title>

    <link rel="stylesheet" href="CSS/signup.css">
    <link rel="icon" type="image/x-icon" href="images/favicon-32x32.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <script src="https://kit.fontawesome.com/83df1a5322.js" crossorigin="anonymous"></script>
   
</head>

<body>
    <!-- This is header section -->
    <header>
        <nav>
            <!-- Logo -->
            <a href="index.html"><img src="images/logo.png" class="logo"></a>

            <!-- Menu -->
            <ul>
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="biteDeals.html">Bite Deals</a></li>
                <li><a href="cart.html"><i class="fa-solid fa-cart-shopping"></i></a></li>
                <li><a href="login.html"><i class="fa-solid fa-right-to-bracket"></i></a></li>
            </ul>

        </nav>
    </header>

    <!--Start authentication section-->
<section class="auth-container">

    <div class="auth-box">

        <h2>Create Account</h2>

        <form id="signUp">
           <div>
            <input type="text" placeholder="Full name"  id="name">
            <small></small>
           </div>
            
           <div>
            <input type="email" placeholder="Email"  id="email">
            <small></small>
           </div>
            
           <div>
            <input type="password" placeholder="Password"  id="password">
            <small></small>
           </div>
            
           <div>
            <input type="password" placeholder="Confirm password"  id="confirm-password">
            <small></small>
           </div>
            

            <button type="submit">Signup</button>
        </form>

        <p>Already have an account? <a href="login.html">Login</a></p>

    </div>

</section>

<!--End authentication section-->

 <script src="formvalidation.js"></script>
</body>

</html>
